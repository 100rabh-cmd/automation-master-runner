name: Master Automation Runner

on:
  schedule:
    # Runs at minute 0 of every hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub UI

permissions:
  contents: write # Allows saving updated last_seen JSON state files back to the repo

jobs:
  run-master:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    # Dynamically generates credentials.json for Google Sheets integration
    - name: Create credentials.json
      env:
        CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
      run: |
        python -c "import os; open('credentials.json', 'w').write(os.environ['CREDENTIALS_JSON'])"

    - name: Execute Master Runner Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN_ANN: ${{ secrets.TELEGRAM_BOT_TOKEN_ANN }}
        TELEGRAM_CHAT_ID_ANN: ${{ secrets.TELEGRAM_CHAT_ID_ANN }}
        TELEGRAM_BOT_TOKEN_RES: ${{ secrets.TELEGRAM_BOT_TOKEN_RES }}
        TELEGRAM_CHAT_ID_RES: ${{ secrets.TELEGRAM_CHAT_ID_RES }}
        TELEGRAM_BOT_TOKEN_CE: ${{ secrets.TELEGRAM_BOT_TOKEN_CE }}
        TELEGRAM_CHAT_ID_CE: ${{ secrets.TELEGRAM_CHAT_ID_CE }}
        TELEGRAM_BOT_TOKEN_CC: ${{ secrets.TELEGRAM_BOT_TOKEN_CC }}
        TELEGRAM_CHAT_ID_CC: ${{ secrets.TELEGRAM_CHAT_ID_CC }}
      run: |
        python master_runner.py

    # Persists updated state files back to GitHub to prevent duplicate alerts
    - name: Commit updated state JSON files
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "auto: update last_seen state files [skip ci]"
        file_pattern: "last_seen_*.json"
